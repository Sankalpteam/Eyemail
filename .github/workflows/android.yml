name: Build the Android app

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    env:
      # Secrets cannot be read inside an if:, so the check is done once here.
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIRESTORE_PROJECT: ${{ secrets.FIRESTORE_PROJECT }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # local.properties is never committed, so the build gets its values from here.
      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "BACKEND_URL=$BACKEND_URL"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIRESTORE_PROJECT=$FIRESTORE_PROJECT"
          } > local.properties
          echo "local.properties written for project $FIRESTORE_PROJECT"

      - name: Build the debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eyemail-debug-apk
          path: native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare the keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build the signed release bundle
        if: env.KEYSTORE_BASE64 != ''
        run: |
          gradle :app:bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload the release bundle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: eyemail-release-aab
          path: native/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
