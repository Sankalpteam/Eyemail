<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Eyemail</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-lg border border-slate-200 p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600 text-white font-bold text-xl mb-3">E</div>
      <h1 class="text-2xl font-bold text-slate-900">Reset Password</h1>
      <p class="text-sm text-slate-500 mt-1">We'll send a password reset link to your linked recovery email</p>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Your Eyemail Address</label>
        <input id="eyemailInput" type="text" required placeholder="yourname@eyemail.in"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 lowercase" />
      </div>

      <button id="resetBtn" type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition shadow-sm">
        Send Reset Link
      </button>
    </form>

    <p class="text-center text-sm text-slate-600 mt-6">
      Remembered your password?
      <a href="login.html" class="text-blue-600 font-semibold hover:underline">Back to Sign in</a>
    </p>
  </div>

  <script type="module">
    import { BACKEND_URL } from "./firebase-config.js";

    const form = document.getElementById("resetForm");
    const alertBox = document.getElementById("alertBox");
    const resetBtn = document.getElementById("resetBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");

      const eyemail = document.getElementById("eyemailInput").value.trim().toLowerCase();
      resetBtn.disabled = true;
      resetBtn.textContent = "Sending reset link...";

      try {
        const res = await fetch(`${BACKEND_URL}/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ eyemail })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Could not send reset email.");

        alertBox.textContent = `Password reset link sent to your recovery email (${data.maskedRecoveryEmail}). Check your Inbox or Spam folder.`;
        alertBox.className = "mb-4 p-3 rounded-lg text-sm bg-emerald-50 text-emerald-700 border border-emerald-200";
        alertBox.classList.remove("hidden");
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.className = "mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200";
        alertBox.classList.remove("hidden");
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
